name: Release

# Publishes ormx-rust-client to crates.io when a `v*` tag is pushed.
# Setup needed (one-time):
#   1. Generate a crates.io API token at https://crates.io/me
#   2. Add it to this repo's secrets as CARGO_REGISTRY_TOKEN
# Then `git tag v0.1.1 && git push --tags` to ship.

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "tag $TAG_VERSION does not match Cargo.toml version $CARGO_VERSION" >&2
            exit 1
          fi

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --no-verify
